pre-commit:
  commands:
    format:
      run: pnpm run format {staged_files}

    lint:
      glob: '**/*.{js,ts,jsx,tsx}'
      # mcp/ and mobile/ have their own lint/test toolchains (own tsconfig).
      exclude:
        - 'mcp/**'
        - 'mobile/**'
      run: pnpm run lint {staged_files}

    test:
      glob: '**/*.test.{js,ts,jsx,tsx}'
      exclude:
        - 'mcp/**'
        - 'mobile/**'
      run: pnpm run test:unit {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
