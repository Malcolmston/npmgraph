# Offline mirror overlay. Layer it on top of the base compose to run the whole
# stack with NO cloud dependencies — local Neo4j + a verdaccio npm registry
# mirror. Once a package has been indexed (see scripts/prewarm.mjs) it resolves
# with no internet at all.
#
#   docker compose -f docker-compose.yml -f docker-compose.offline.yml \
#     --profile graph up -d npmgraph neo4j verdaccio api
#
# Then pre-warm the caches (routes through verdaccio into Neo4j):
#   node scripts/prewarm.mjs packages.txt
services:
  # Local npm registry mirror: proxies + caches the public registry, then serves
  # from disk when offline.
  verdaccio:
    image: verdaccio/verdaccio:6
    ports:
      - '4873:4873'
    volumes:
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - verdaccio-storage:/verdaccio/storage
    healthcheck:
      # Use 127.0.0.1 (not localhost): busybox wget resolves localhost to ::1
      # but verdaccio binds IPv4 0.0.0.0.
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:4873/-/ping >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Point the API at the local mirror + local Neo4j (ignore any Aura URI in .env).
  api:
    environment:
      NPM_REGISTRY: 'http://verdaccio:4873'
      NEO4J_URI: 'neo4j://neo4j:7687'
      NEO4J_USER: 'neo4j'
      NEO4J_PASSWORD: '${NEO4J_PASSWORD:-npmgraph123}'
      NEO4J_DATABASE: ''
    depends_on:
      neo4j:
        condition: service_healthy
      verdaccio:
        condition: service_healthy

  # Same for the stdio MCP server.
  mcp:
    environment:
      NPM_REGISTRY: 'http://verdaccio:4873'
      NEO4J_URI: 'neo4j://neo4j:7687'
      NEO4J_USER: 'neo4j'
      NEO4J_PASSWORD: '${NEO4J_PASSWORD:-npmgraph123}'
    depends_on:
      neo4j:
        condition: service_healthy
      verdaccio:
        condition: service_healthy

volumes:
  verdaccio-storage:
