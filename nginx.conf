server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Load the full default MIME map (a bare `types {}` block would REPLACE it,
    # dropping text/html/css/js and making the browser download files). nginx's
    # default mime.types already maps `application/wasm wasm` for graphviz.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # gzip static assets
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length   1024;

    # Proxy API calls to the npmgraph HTTP API service (the "graph" compose
    # profile). Using a variable + Docker's embedded DNS resolver means nginx
    # still starts when the `api` service isn't running (requests just 502).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3100;
        # $request_uri keeps the full "/api/..." path the API routes expect.
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Pretty front door for the graph tool: /mcp (landing) and /mcp/<package>.
    location /mcp {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_upstream http://api:3100;
        proxy_pass $mcp_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed build assets
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
